.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft); }
.btns { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { height: 34px; padding: 0 12px; border: 1px solid var(--rule); background: var(--panel); border-radius: 9px; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--panel-2); }

.pill.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
.pill.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 16%, transparent); }
.pill.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }
/* composition des murs, planchers et plafonds (compositionsui.js) */
.compo-bar-w { margin: 4px 0 8px; }
.compo-sides { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--c-ink2); margin-bottom: 3px; }
.compo-bar { display: flex; height: 30px; border: 1px solid var(--c-ink2); border-radius: 4px; overflow: hidden; }
.compo-bar > span { display: block; line-height: 30px; text-align: center; text-overflow: ellipsis; padding: 0 2px; min-width: 3px; font-size: 10px; font-weight: 700; color: #2a2a2a; overflow: hidden; white-space: nowrap; border-right: 1px solid rgba(0,0,0,.25); }
.compo-bar > span:last-child { border-right: 0; }
.compo-list { display: flex; flex-direction: column; gap: 8px; margin: 6px 0; }
.compo-row { border: 1px solid var(--line, rgba(0,0,0,.12)); border-radius: 8px; padding: 6px 8px; }
.compo-top { display: flex; align-items: center; gap: 6px; }

.compo-sw { width: 14px; height: 28px; border-radius: 3px; border: 1px solid rgba(0,0,0,.25); flex: 0 0 auto; }
.compo-mv { display: flex; gap: 4px; flex: 0 0 auto; }

.compo-ok .pill { flex: 0 0 auto; }
.compo-niv { margin-bottom: 10px; }
/* bibliothèque technique : désignations lisibles sur chantier, badge de fiabilité */
.badge { display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border-radius: 12px; font-size: 12px; font-weight: 700; white-space: nowrap; border: 1px solid transparent; }
.badge.b-verifiee { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
.badge.b-saisie { color: var(--elec); background: color-mix(in srgb, var(--elec) 11%, transparent); }
.badge.b-estimee { color: var(--warn); background: color-mix(in srgb, var(--warn) 16%, transparent); border-style: dashed; border-color: var(--warn); }
.art-list { display: flex; flex-direction: column; gap: 6px; }
.art-li { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 10px; background: var(--c-room); min-height: 44px; }
.art-li b { display: block; font-size: 15px; line-height: 1.25; }
.art-li small { display: block; color: var(--ink-3); font-size: 12px; margin-top: 2px; overflow-wrap: anywhere; }
.art-li .btn.sm { height: 36px; padding: 0 12px; }
.art-mini { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; margin-top: 8px; }
.art-mini-l { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.art-mini-l small { color: var(--ink-3); font-size: 12px; overflow-wrap: anywhere; }
.art-mini .btn.sm { height: 36px; }
.range-fld { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; }
.range-fld .v { font-family: var(--f-num); font-size: 13px; min-width: 42px; text-align: right; }
.range { width: 100%; height: 36px; accent-color: var(--accent); }
.card-add { justify-content: center; border-style: dashed; color: var(--accent-ink); }
.card-add .plus { font-size: 30px; line-height: 1; font-weight: 400; }
.cform { display: flex; flex-direction: column; gap: 10px; }
.cform .row { align-items: end; }
.cthumb { flex: none; width: 72px; height: 72px; border: 1px solid var(--rule); border-radius: 10px; display: grid; place-items: center; background: var(--c-room); }
.cthumb canvas { width: 64px; height: 64px; }
.csub { margin: 8px 0 0; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.fiab-legend { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--ink-2); }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 13px; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; font-family: var(--f-num); font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.list { display: flex; flex-direction: column; }
.li { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; padding: 7px 4px; border: 0; border-bottom: 1px solid var(--rule); background: transparent; text-align: left; font-size: 13px; }
.li:last-child { border-bottom: 0; }
.li .v { font-family: var(--f-num); font-weight: 600; font-variant-numeric: tabular-nums; }
.li canvas { width: 28px; height: 28px; }
.li .sw { width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--rule); }
.li.tot { font-weight: 700; border-top: 1px solid var(--ink-3); border-bottom: 0; }
button.li:hover { background: var(--panel-2); }
.tints { display: flex; gap: 6px; flex-wrap: wrap; }
.tints button { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--rule); position: relative; }
.tints button[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 1px; }
.tints button.none::after { content: ""; position: absolute; left: 4px; right: 4px; top: 50%; height: 1.5px; background: var(--ink-3); transform: rotate(-45deg); }
.empty-help { font-size: 13px; color: var(--ink-2); display: flex; flex-direction: column; gap: 8px; }
.empty-help kbd { font-family: var(--f-num); font-size: 11.5px; padding: 1px 5px; border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; background: var(--panel-2); }

/* ---- panneaux flottants ---- */
.pop { position: fixed; z-index: 20; background: var(--panel); border: 1px solid var(--rule); border-radius: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; max-height: min(78vh, 640px); }
.pop-head { display: flex; align-items: center; gap: 8px; padding: 12px 12px 8px 16px; }
.pop-head h2 { margin: 0; font-size: 15px; font-weight: 700; flex: 1; }
.tabs { display: flex; gap: 4px; padding: 0 12px 10px; overflow-x: auto; scrollbar-width: none; flex: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { height: 30px; padding: 0 11px; border: 1px solid var(--rule); border-radius: 15px; background: transparent; font-size: 12.5px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.tab[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--panel); }
/* bibliothèque : domaines (grandes pastilles) puis sous-catégories, sur plusieurs lignes pour rester visibles au doigt et au Pencil */
.tabs.dom { flex-wrap: wrap; gap: 6px; padding-bottom: 8px; }
.tabs.dom .tab { height: 38px; padding: 0 14px; font-size: 13.5px; border-radius: 19px; }
.tabs.subs { flex-wrap: wrap; gap: 5px; padding-top: 2px; border-top: 1px solid var(--rule); padding-top: 8px; margin: 0 12px; padding-left: 0; padding-right: 0; }
.tabs.subs .tab { height: 34px; border-radius: 17px; }
.tabs.subs .tab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.grid-cat { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; padding: 4px 12px 14px; overflow-y: auto; min-height: 0; }
.card { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px 7px; border: 1px solid var(--rule); border-radius: 10px; background: var(--c-room); font-size: 11.5px; font-weight: 600; text-align: center; line-height: 1.2; color: var(--ink); min-height: 104px; }
.card:hover { border-color: var(--accent); }
.cat-search { padding: 0 12px 10px; flex: none; }
.cat-search input { width: 100%; height: 38px; padding: 0 12px; border: 1px solid var(--rule); background: var(--c-room); border-radius: 10px; font-size: 14px; }
.cat-search input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.card canvas { width: 64px; height: 64px; }
.card small { font-family: var(--f-num); font-weight: 500; color: var(--ink-3); font-size: 11px; }
.menu { padding: 6px; min-width: 250px; overflow-y: auto; }
.menu > button, .menu > label { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 38px; padding: 0 10px; border: 0; background: transparent; border-radius: 8px; text-align: left; font-size: 13.5px; }
.menu > button:hover, .menu > label:hover { background: var(--panel-2); }
.menu svg { width: 17px; height: 17px; flex: none; opacity: .8; }
.menu hr { border: 0; height: 1px; background: var(--rule); margin: 5px 4px; }
.menu h4 { margin: 8px 10px 4px; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.menu .sw { margin-left: auto; width: 34px; height: 20px; border-radius: 10px; background: var(--rule); position: relative; flex: none; transition: background .15s; }
.menu .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--panel); box-shadow: 0 1px 2px rgba(0, 0, 0, .25); transition: transform .15s; }
.menu [aria-checked="true"] .sw { background: var(--accent); }
.menu [aria-checked="true"] .sw::after { transform: translateX(14px); }
.menu .seg { margin: 2px 6px 6px; }
.scrim { position: fixed; inset: 0; z-index: 19; background: rgba(10, 14, 12, .28); }
.modal { position: fixed; z-index: 21; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(480px, calc(100vw - 32px)); max-height: min(80vh, 640px); display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--rule); border-radius: 16px; box-shadow: var(--shadow); }
.modal .mbody { padding: 4px 16px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.proj-li { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 10px; background: var(--c-room); }
.proj-li[aria-current="true"] { border-color: var(--accent); }
.proj-li b { display: block; font-size: 14px; }
.proj-li small { color: var(--ink-3); font-size: 12px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); z-index: 30; padding: 10px 16px; border-radius: 10px; background: var(--ink); color: var(--panel); font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; max-width: calc(100vw - 40px); text-align: center; }
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
.upd { position: fixed; left: 50%; top: calc(10px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 40; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; padding: 8px 8px 8px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--rule); box-shadow: var(--shadow); font-size: 13px; font-weight: 600; max-width: calc(100vw - 32px); }
.upd button { height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--rule); background: var(--panel-2); font-weight: 600; }
.upd button.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
.upd.sauv { top: auto; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); max-width: calc(100vw - 32px); }
.upd.sauv span { flex: 1 1 260px; }
@media (max-width: 600px) { .upd.sauv { left: 16px; right: 16px; transform: none; max-width: none; bottom: calc(100px + env(safe-area-inset-bottom, 0px)); justify-content: flex-start; } .upd.sauv span { flex-basis: 100%; } }

/* ---- tailles d'écran ---- */
@media (max-width: 1099px) {
  .main { grid-template-columns: auto minmax(0, 1fr); }
  .main:has(> .insp:not(.closed)) .zoom { right: 310px; }
  .insp { position: absolute; right: 10px; top: 10px; bottom: 10px; width: 290px; z-index: 5; box-shadow: var(--shadow); }
  .insp-head .x { display: grid; }
  .insp.closed { display: none; }
}
@media (max-width: 760px) {
  body { font-size: 13.5px; }
  .app { gap: 8px; padding-block: 8px; }
  .brand { display: none; }
  .topbar { gap: 6px; }
  .ib { width: 34px; height: 34px; }
  .lvl { padding: 0 9px; font-size: 12.5px; }
  .proj { max-width: 38vw; padding: 0 6px; }
  .save b { display: none; }
  .main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto auto; gap: 8px; }
  .toolbar { flex-direction: row; order: 3; overflow-x: auto; overflow-y: hidden; padding: 4px; }
  .tool { width: 58px; min-height: 50px; }
  .tsep { width: 1px; height: auto; margin: 6px 3px; }
  .insp { position: static; order: 2; width: auto; max-height: 40vh; box-shadow: none; }
  .main:has(> .insp:not(.closed)) .zoom { right: 10px; }
  .insp-head { padding: 10px 12px 8px; }
  .insp-body { padding: 10px 12px 14px; }
  .hint { top: 8px; font-size: 12.5px; padding: 6px 6px 6px 10px; }
  .status .xy { display: none; }
  .pop.sheet { left: max(16px, env(safe-area-inset-left, 0px)) !important; right: max(16px, env(safe-area-inset-right, 0px)) !important; top: auto !important; bottom: calc(10px + env(safe-area-inset-bottom, 0px)) !important; width: auto !important; max-height: 70vh; }
}

/* ---- onglets de vue ---- */
.vtabs { flex: none; }
.vtabs button { min-height: 30px; padding: 0 13px; }

/* ---- onglet tableau électrique ---- */
.ev { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 10px; min-height: 0; }
.ev-side { background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r); overflow-y: auto; padding: 14px 12px 18px; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
.ev-head h2 { margin: 0; font-size: 16px; font-weight: 750; }
.ev-head p { margin: 2px 0 2px; font-size: 12.5px; color: var(--ink-2); }
.ev-group { display: flex; flex-direction: column; gap: 2px; border: 1px solid var(--rule); border-radius: 12px; padding: 4px; background: var(--c-room); }
.ev-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; width: 100%; padding: 8px; border: 0; border-radius: 9px; background: transparent; text-align: left; color: var(--ink); }
button.ev-row:hover { background: var(--panel-2); }
.ev-row[aria-expanded="true"] { background: var(--accent-soft); }
.ev-inst { border: 1px solid var(--rule); background: var(--c-room); border-radius: 12px; }
.ev-rcd { background: var(--panel-2); }
.ev-rcd.bad small { color: var(--bad); }
.ev-main { display: flex; flex-direction: column; min-width: 0; }
.ev-main b { font-size: 13.5px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev-main small { font-size: 12px; color: var(--ink-2); font-family: var(--f-num); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ev-badge { min-width: 44px; height: 26px; padding: 0 6px; border-radius: 7px; background: var(--ink); color: var(--panel); font-size: 12px; font-weight: 700; display: grid; place-items: center; font-family: var(--f-num); }
.ev-badge.a { background: var(--accent); color: var(--on-accent); }
.ev-num { min-width: 34px; height: 22px; padding: 0 5px; border-radius: 6px; border: 1.6px solid var(--cc, var(--elec)); color: var(--cc, var(--elec)); font-family: var(--f-num); font-weight: 700; font-size: 12px; display: inline-grid; place-items: center; background: var(--c-room); }
.ev-dot { width: 9px; height: 9px; border-radius: 50%; }
.ev-dot.ok { background: var(--ok); } .ev-dot.err { background: var(--bad); } .ev-dot.idle { background: var(--rule); }
.ev-edit { padding: 10px 6px 12px; display: flex; flex-direction: column; gap: 12px; border-top: 1px solid var(--rule); margin: 2px 4px 6px; }
.ev-actions { padding: 2px 0 4px; }
.ev-work { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; }
.ev-bar { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
.ev-bar > .seg { max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.ev-bar > .seg button { flex: none; }
.ev-bar .seg button { padding: 0 12px; display: inline-flex; align-items: center; justify-content: center; }
.ev-count { margin-left: 7px; min-width: 20px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--ok); color: #fff; font-size: 11px; display: inline-grid; place-items: center; font-family: var(--f-num); }
.ev-count.err { background: var(--bad); } .ev-count.ver { background: var(--warn); }
.ev-canvas { flex: 1; min-height: 0; overflow: auto; padding: 16px; background: var(--c-room); -webkit-overflow-scrolling: touch; }
.ev-svg svg { display: block; max-width: none; }
.ev-table { margin-top: 20px; max-width: 780px; }
.ev-table h3, .ev-checks h3 { margin: 4px 0 8px; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.ev-table table { width: 100%; border-collapse: collapse; font-size: 13px; }
.ev-table th { text-align: left; font-size: 11.5px; color: var(--ink-2); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--rule); }
.ev-table td { padding: 7px 8px; border-bottom: 1px solid var(--rule); }
.ev-table td.n { font-family: var(--f-num); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ev-table tr { cursor: pointer; }
.ev-table tr.on td { background: var(--accent-soft); }
.ev-empty { max-width: 460px; margin: 48px auto; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; color: var(--ink-2); }
.ev-empty h3 { margin: 0; color: var(--ink); font-size: 18px; }
.ev-empty p { margin: 0; }
.ev-checks { max-width: 840px; display: flex; flex-direction: column; gap: 14px; }
.ev-sum { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ev-sumbox { padding: 12px 14px; border-radius: 12px; border: 1px solid var(--rule); background: var(--panel); display: flex; flex-direction: column; gap: 2px; }
.ev-sumbox b { font-size: 28px; font-family: var(--f-num); line-height: 1; font-variant-numeric: tabular-nums; }
.ev-sumbox span { font-size: 12.5px; color: var(--ink-2); }
.ev-sumbox.err b { color: var(--bad); } .ev-sumbox.warn b { color: var(--warn); } .ev-sumbox.ok b, .ev-sumbox.okb b { color: var(--ok); }
.ev-list { display: flex; flex-direction: column; border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; background: var(--panel); }
.ev-chk { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 9px 12px; border: 0; border-bottom: 1px solid var(--rule); background: transparent; text-align: left; font-size: 13.5px; width: 100%; color: var(--ink); }
.ev-chk:last-child { border-bottom: 0; }
