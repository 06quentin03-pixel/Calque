<style>
/* Mise en page : atelier plein écran — outils | calque de dessin | inspecteur */
:root {
  --chrome: #E4E7E3; --panel: #F8F9F7; --panel-2: #EDF0EC; --ink: #1A1E22; --ink-2: #59626A; --ink-3: #8A939A; --rule: #D0D5D0;
  --accent: #D24F1A; --accent-ink: #A63D10; --on-accent: #FFFFFF; --accent-soft: rgba(210, 79, 26, .11);
  --elec: #2356C4; --ok: #2D7A4C; --warn: #A86E12; --bad: #BF3428; --shadow: 0 10px 30px rgba(20, 30, 28, .14), 0 2px 6px rgba(20, 30, 28, .08);
  --c-paper: #ECEFEB; --c-room: #FFFFFF; --c-ink: #1D2125; --c-ink2: #5C656C; --c-wall: #252A2F; --c-part: #98A0A6; --c-fill: #FFFFFF; --c-tone: #E5E8E3;
  --c-grid: rgba(30, 44, 40, .06); --c-gridMajor: rgba(30, 44, 40, .13); --c-accent: #D24F1A; --c-accentSoft: rgba(210, 79, 26, .12); --c-elec: #2356C4; --c-ghost: rgba(30, 44, 40, .11);
  --c-vmc: #0B8C88; --c-gaine: #6D4FC2;
  --c-t1: rgba(214, 165, 80, .22); --c-t2: rgba(96, 160, 104, .2); --c-t3: rgba(80, 146, 214, .18); --c-t4: rgba(222, 110, 132, .18); --c-t5: rgba(146, 114, 214, .18); --c-t6: rgba(84, 96, 108, .16);
  --f-ui: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num: "Archivo Narrow", "Arial Narrow", system-ui, sans-serif;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --chrome: #101215; --panel: #181B1F; --panel-2: #1F2328; --ink: #E5E8E4; --ink-2: #A0A9AF; --ink-3: #6E777E; --rule: #2B3036;
    --accent: #FF7A3E; --accent-ink: #FF9663; --on-accent: #1A0E07; --accent-soft: rgba(255, 122, 62, .14);
    --elec: #7FA8FF; --ok: #5BC38A; --warn: #E2AE4E; --bad: #FF7468; --shadow: 0 10px 30px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .3);
    --c-paper: #14171A; --c-room: #1C2024; --c-ink: #E2E5E1; --c-ink2: #9AA3AA; --c-wall: #D5D9D4; --c-part: #6C757B; --c-fill: #1C2024; --c-tone: #292E33;
    --c-grid: rgba(220, 230, 225, .045); --c-gridMajor: rgba(220, 230, 225, .1); --c-accent: #FF7A3E; --c-accentSoft: rgba(255, 122, 62, .16); --c-elec: #7FA8FF; --c-ghost: rgba(220, 230, 225, .1);
    --c-vmc: #3DD3C9; --c-gaine: #A993FF;
    --c-t1: rgba(214, 165, 80, .16); --c-t2: rgba(110, 180, 118, .14); --c-t3: rgba(96, 160, 230, .14); --c-t4: rgba(230, 120, 140, .14); --c-t5: rgba(160, 130, 230, .14); --c-t6: rgba(160, 170, 180, .1);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --chrome: #101215; --panel: #181B1F; --panel-2: #1F2328; --ink: #E5E8E4; --ink-2: #A0A9AF; --ink-3: #6E777E; --rule: #2B3036;
  --accent: #FF7A3E; --accent-ink: #FF9663; --on-accent: #1A0E07; --accent-soft: rgba(255, 122, 62, .14);
  --elec: #7FA8FF; --ok: #5BC38A; --warn: #E2AE4E; --bad: #FF7468; --shadow: 0 10px 30px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .3);
  --c-paper: #14171A; --c-room: #1C2024; --c-ink: #E2E5E1; --c-ink2: #9AA3AA; --c-wall: #D5D9D4; --c-part: #6C757B; --c-fill: #1C2024; --c-tone: #292E33;
  --c-grid: rgba(220, 230, 225, .045); --c-gridMajor: rgba(220, 230, 225, .1); --c-accent: #FF7A3E; --c-accentSoft: rgba(255, 122, 62, .16); --c-elec: #7FA8FF; --c-ghost: rgba(220, 230, 225, .1);
  --c-vmc: #3DD3C9; --c-gaine: #A993FF;
    --c-t1: rgba(214, 165, 80, .16); --c-t2: rgba(110, 180, 118, .14); --c-t3: rgba(96, 160, 230, .14); --c-t4: rgba(230, 120, 140, .14); --c-t5: rgba(160, 130, 230, .14); --c-t6: rgba(160, 170, 180, .1);
  color-scheme: dark;
}
html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: border-box; }
body {
  height: 100%; margin: 0; overflow: hidden; background: var(--chrome); color: var(--ink);
  font-family: var(--f-ui); font-size: 14px; line-height: 1.35; -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 10px; padding-block: 10px; }

/* ---- barre du haut ---- */
.topbar { display: flex; align-items: center; gap: 8px; min-width: 0; }
.brand { font-weight: 800; font-stretch: 125%; letter-spacing: .1em; font-size: 15px; display: flex; align-items: center; gap: 8px; padding-right: 4px; white-space: nowrap; }
.brand svg { width: 22px; height: 22px; flex: none; }
.proj { display: flex; align-items: center; gap: 4px; min-width: 0; max-width: 260px; height: 36px; padding: 0 10px; border: 1px solid transparent; background: transparent; border-radius: 9px; font-weight: 600; }
.proj:hover { background: var(--panel-2); }
.proj span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proj svg { width: 14px; height: 14px; flex: none; opacity: .6; }
.levels { position: relative; display: flex; align-items: center; gap: 4px; padding: 3px; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.levels::-webkit-scrollbar { display: none; }
.lvl { height: 30px; padding: 0 11px; border: 0; border-radius: 7px; background: transparent; white-space: nowrap; font-weight: 600; font-size: 13px; color: var(--ink-2); }
.lvl[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.lvl.add { width: 30px; padding: 0; display: grid; place-items: center; }
.spacer { flex: 1; }
.ib { width: 36px; height: 36px; display: grid; place-items: center; border: 1px solid var(--rule); background: var(--panel); border-radius: 9px; flex: none; }
.ib:hover { background: var(--panel-2); }
.ib:disabled { opacity: .35; cursor: default; }
.ib svg { width: 18px; height: 18px; }
.save { font-size: 12px; color: var(--ink-3); white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.save i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); display: inline-block; }
.save[data-s="dirty"] i { background: var(--warn); }
.save[data-s="local"] i { background: var(--ink-3); }
.save[data-s="err"] i { background: var(--bad); }

/* ---- zone principale ---- */
.main { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr) clamp(270px, 24vw, 310px); gap: 10px; min-height: 0; }
.toolbar { display: flex; flex-direction: column; gap: 2px; padding: 6px; background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r); overflow-y: auto; scrollbar-width: none; }
.tool { width: 62px; min-height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: 0; background: transparent; border-radius: 9px; color: var(--ink-2); font-size: 10.5px; font-weight: 600; padding: 4px 2px; flex: none; }
.tool svg { width: 22px; height: 22px; }
.tool:hover { background: var(--panel-2); color: var(--ink); }
.tool[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-ink); }
.tsep { height: 1px; background: var(--rule); margin: 4px 6px; flex: none; }
.stage { position: relative; min-width: 0; min-height: 0; border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; background: var(--c-paper); }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }

/* bandeau d'aide contextuel */
.hint { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100% - 20px); display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 7px 8px 7px 12px; background: var(--panel); border: 1px solid var(--rule); border-radius: 11px; box-shadow: var(--shadow); font-size: 13px; z-index: 3; }
.hint b { font-weight: 700; }
.hint .msg { color: var(--ink-2); min-width: 0; }
.hint .grp { display: flex; align-items: center; gap: 4px; }
.hint input.txt { width: 88px; }
.hint .dirs { display: flex; gap: 2px; }
.hint .dirs button { width: 32px; height: 32px; border: 1px solid var(--rule); background: var(--panel-2); border-radius: 7px; display: grid; place-items: center; font-size: 15px; }

.zoom { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 4px; z-index: 2; }
.status { position: absolute; left: 10px; bottom: 10px; display: flex; align-items: center; gap: 10px; padding: 5px 10px; background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--rule); border-radius: 9px; font-family: var(--f-num); font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; z-index: 2; pointer-events: none; }
.scalebar { display: flex; flex-direction: column; gap: 2px; }
.scalebar i { display: block; height: 5px; border: 1.5px solid var(--ink-2); border-top: 0; }

/* ---- inspecteur ---- */
.insp { background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r); overflow-y: auto; min-height: 0; display: flex; flex-direction: column; }
.insp-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: flex-start; gap: 8px; padding: 14px 14px 10px; background: var(--panel); border-bottom: 1px solid var(--rule); }
.insp-head h2 { margin: 0; font-size: 15px; font-weight: 700; text-wrap: balance; }
.insp-head p { margin: 2px 0 0; font-size: 12px; color: var(--ink-2); }
.insp-head .x { margin-left: auto; width: 30px; height: 30px; border: 0; background: transparent; border-radius: 7px; display: none; place-items: center; }
.insp-body { padding: 12px 14px 18px; display: flex; flex-direction: column; gap: 14px; }
.sec { display: flex; flex-direction: column; gap: 8px; }
.sec h3 { margin: 0; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.row.r3 { grid-template-columns: 1fr 1fr 1fr; }
.fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fld > span { font-size: 12px; color: var(--ink-2); }
.inp { position: relative; display: flex; align-items: center; }
.inp input, .inp select, input.txt, select.txt { width: 100%; height: 34px; padding: 0 9px; border: 1px solid var(--rule); background: var(--c-room); border-radius: 8px; font-variant-numeric: tabular-nums; min-width: 0; }
.inp input.num { padding-right: 34px; font-family: var(--f-num); font-size: 15px; font-weight: 600; }
.inp em { position: absolute; right: 9px; font-style: normal; font-size: 12px; color: var(--ink-3); pointer-events: none; }
.inp input:focus, input.txt:focus, select.txt:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.ro { font-family: var(--f-num); font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.seg { display: flex; padding: 3px; gap: 2px; background: var(--panel-2); border: 1px solid var(--rule); border-radius: 9px; }
.seg button { flex: 1; min-height: 30px; padding: 0 6px; border: 0; border-radius: 6px; background: transparent; font-size: 13px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { height: 28px; padding: 0 9px; border: 1px solid var(--rule); background: var(--panel); border-radius: 14px; font-size: 12.5px; font-family: var(--f-num); font-weight: 600; color: var(--ink-2); }
.chip:hover { border-color: var(--ink-3); color: var(--ink); }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft); }
.btns { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { height: 34px; padding: 0 12px; border: 1px solid var(--rule); background: var(--panel); border-radius: 9px; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--panel-2); }
.btn svg { width: 16px; height: 16px; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.pri:hover { filter: brightness(1.05); }
.btn.danger { color: var(--bad); }
.btn.sm { height: 30px; padding: 0 10px; font-size: 12.5px; }
.note { font-size: 12.5px; color: var(--ink-2); margin: 0; }
.pill { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 12px; font-weight: 700; }
.pill.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
.pill.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 16%, transparent); }
.pill.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 13px; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; font-family: var(--f-num); font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.list { display: flex; flex-direction: column; }
.li { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; padding: 7px 4px; border: 0; border-bottom: 1px solid var(--rule); background: transparent; text-align: left; font-size: 13px; }
.li:last-child { border-bottom: 0; }
.li .v { font-family: var(--f-num); font-weight: 600; font-variant-numeric: tabular-nums; }
.li canvas { width: 28px; height: 28px; }
.li .sw { width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--rule); }
.li.tot { font-weight: 700; border-top: 1px solid var(--ink-3); border-bottom: 0; }
button.li:hover { background: var(--panel-2); }
.tints { display: flex; gap: 6px; flex-wrap: wrap; }
.tints button { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--rule); position: relative; }
.tints button[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 1px; }
.tints button.none::after { content: ""; position: absolute; left: 4px; right: 4px; top: 50%; height: 1.5px; background: var(--ink-3); transform: rotate(-45deg); }
.empty-help { font-size: 13px; color: var(--ink-2); display: flex; flex-direction: column; gap: 8px; }
.empty-help kbd { font-family: var(--f-num); font-size: 11.5px; padding: 1px 5px; border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; background: var(--panel-2); }

/* ---- panneaux flottants ---- */
.pop { position: fixed; z-index: 20; background: var(--panel); border: 1px solid var(--rule); border-radius: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; max-height: min(78vh, 640px); }
.pop-head { display: flex; align-items: center; gap: 8px; padding: 12px 12px 8px 16px; }
.pop-head h2 { margin: 0; font-size: 15px; font-weight: 700; flex: 1; }
.tabs { display: flex; gap: 4px; padding: 0 12px 10px; overflow-x: auto; scrollbar-width: none; flex: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { height: 30px; padding: 0 11px; border: 1px solid var(--rule); border-radius: 15px; background: transparent; font-size: 12.5px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.tab[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--panel); }
.grid-cat { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; padding: 4px 12px 14px; overflow-y: auto; min-height: 0; }
.card { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px 7px; border: 1px solid var(--rule); border-radius: 10px; background: var(--c-room); font-size: 11.5px; font-weight: 600; text-align: center; line-height: 1.2; color: var(--ink); min-height: 104px; }
.card:hover { border-color: var(--accent); }
.cat-search { padding: 0 12px 10px; flex: none; }
.cat-search input { width: 100%; height: 38px; padding: 0 12px; border: 1px solid var(--rule); background: var(--c-room); border-radius: 10px; font-size: 14px; }
.cat-search input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.card canvas { width: 64px; height: 64px; }
.card small { font-family: var(--f-num); font-weight: 500; color: var(--ink-3); font-size: 11px; }
.menu { padding: 6px; min-width: 250px; overflow-y: auto; }
.menu > button, .menu > label { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 38px; padding: 0 10px; border: 0; background: transparent; border-radius: 8px; text-align: left; font-size: 13.5px; }
.menu > button:hover, .menu > label:hover { background: var(--panel-2); }
.menu svg { width: 17px; height: 17px; flex: none; opacity: .8; }
.menu hr { border: 0; height: 1px; background: var(--rule); margin: 5px 4px; }
.menu h4 { margin: 8px 10px 4px; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.menu .sw { margin-left: auto; width: 34px; height: 20px; border-radius: 10px; background: var(--rule); position: relative; flex: none; transition: background .15s; }
.menu .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--panel); box-shadow: 0 1px 2px rgba(0, 0, 0, .25); transition: transform .15s; }
.menu [aria-checked="true"] .sw { background: var(--accent); }
.menu [aria-checked="true"] .sw::after { transform: translateX(14px); }
.menu .seg { margin: 2px 6px 6px; }
.scrim { position: fixed; inset: 0; z-index: 19; background: rgba(10, 14, 12, .28); }
.modal { position: fixed; z-index: 21; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(480px, calc(100vw - 32px)); max-height: min(80vh, 640px); display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--rule); border-radius: 16px; box-shadow: var(--shadow); }
.modal .mbody { padding: 4px 16px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.proj-li { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 10px; background: var(--c-room); }
.proj-li[aria-current="true"] { border-color: var(--accent); }
.proj-li b { display: block; font-size: 14px; }
.proj-li small { color: var(--ink-3); font-size: 12px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); z-index: 30; padding: 10px 16px; border-radius: 10px; background: var(--ink); color: var(--panel); font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; max-width: calc(100vw - 40px); text-align: center; }
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---- tailles d'écran ---- */
@media (max-width: 1099px) {
  .main { grid-template-columns: auto minmax(0, 1fr); }
  .main:has(> .insp:not(.closed)) .zoom { right: 310px; }
  .insp { position: absolute; right: 10px; top: 10px; bottom: 10px; width: 290px; z-index: 5; box-shadow: var(--shadow); }
  .insp-head .x { display: grid; }
  .insp.closed { display: none; }
}
@media (max-width: 760px) {
  body { font-size: 13.5px; }
  .app { gap: 8px; padding-block: 8px; }
  .brand { display: none; }
  .topbar { gap: 6px; }
  .ib { width: 34px; height: 34px; }
  .lvl { padding: 0 9px; font-size: 12.5px; }
  .proj { max-width: 38vw; padding: 0 6px; }
  .save b { display: none; }
  .main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto auto; gap: 8px; }

<script>
(() => {
'use strict';
/* ============================================================
   CALQUE — noyau : utilitaires, modèle, géométrie, mutations
   Unités internes : centimètres. Axe Y vers le bas (comme l'écran).
   ============================================================ */

const DEG = Math.PI / 180;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const uid = (p) => (p || '') + Math.random().toString(36).slice(2, 9);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const snapTo = (v, step) => (step > 0 ? Math.round(v / step) * step : v);
const isNum = (v) => typeof v === 'number' && isFinite(v);

/* ---------- vecteurs ---------- */
const vadd = (a, b) => ({ x: a.x + b.x, y: a.y + b.y });
const vsub = (a, b) => ({ x: a.x - b.x, y: a.y - b.y });
const vmul = (a, s) => ({ x: a.x * s, y: a.y * s });
const vdot = (a, b) => a.x * b.x + a.y * b.y;
const vcrs = (a, b) => a.x * b.y - a.y * b.x;
const vlen = (a) => Math.hypot(a.x, a.y);
const vdist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const vnorm = (a) => { const l = Math.hypot(a.x, a.y) || 1; return { x: a.x / l, y: a.y / l }; };
const vperp = (a) => ({ x: -a.y, y: a.x });
const vmid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
const vang = (a) => Math.atan2(a.y, a.x);
const vdir = (ang) => ({ x: Math.cos(ang), y: Math.sin(ang) });

function lineX(p, d, q, e) {
  const den = vcrs(d, e);
  if (Math.abs(den) < 1e-9) return null;
  const s = vcrs(vsub(q, p), e) / den;
  return vadd(p, vmul(d, s));
}
function projSeg(p, a, b) {
  const ab = vsub(b, a);
  const L2 = vdot(ab, ab) || 1e-9;
  const t = vdot(vsub(p, a), ab) / L2;
  const tc = clamp(t, 0, 1);
  const pt = vadd(a, vmul(ab, tc));
  return { t, tc, pt, d: vdist(p, pt) };
}
function segX(a, b, c, d) {
  const r = vsub(b, a), s = vsub(d, c);
  const den = vcrs(r, s);
  if (Math.abs(den) < 1e-9) return null;
  const ca = vsub(c, a);
  const t = vcrs(ca, s) / den, u = vcrs(ca, r) / den;
  return { t, u, pt: vadd(a, vmul(r, t)) };
}
function polyArea(p) {
  let s = 0;
  for (let i = 0, n = p.length; i < n; i++) {
    const a = p[i], b = p[(i + 1) % n];
    s += a.x * b.y - b.x * a.y;
  }
  return s / 2;
}
function polyPerim(p) {
  let s = 0;
  for (let i = 0, n = p.length; i < n; i++) s += vdist(p[i], p[(i + 1) % n]);
  return s;
}
function inPoly(pt, poly) {
  let c = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const a = poly[i], b = poly[j];
    if ((a.y > pt.y) !== (b.y > pt.y) && pt.x < ((b.x - a.x) * (pt.y - a.y)) / (b.y - a.y) + a.x) c = !c;
  }
  return c;
}
function distToEdges(pt, poly) {
  let m = Infinity;
  for (let i = 0, n = poly.length; i < n; i++) m = Math.min(m, projSeg(pt, poly[i], poly[(i + 1) % n]).d);
  return m;
}
function bboxOf(pts) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const p of pts) { if (p.x < x0) x0 = p.x; if (p.y < y0) y0 = p.y; if (p.x > x1) x1 = p.x; if (p.y > y1) y1 = p.y; }
  return { x0, y0, x1, y1 };
}
/* point intérieur le plus éloigné des bords (approximation par grille raffinée) */
function labelPoint(poly) {
  const bb = bboxOf(poly);
  let best = null, bestD = -1;
  let cx = (bb.x0 + bb.x1) / 2, cy = (bb.y0 + bb.y1) / 2;
  let wx = bb.x1 - bb.x0, wy = bb.y1 - bb.y0;
  for (let pass = 0; pass < 4; pass++) {
    const N = 10;
    for (let i = 0; i <= N; i++) for (let j = 0; j <= N; j++) {
      const p = { x: cx - wx / 2 + (wx * i) / N, y: cy - wy / 2 + (wy * j) / N };
      if (!inPoly(p, poly)) continue;
      const d = distToEdges(p, poly);
      if (d > bestD) { bestD = d; best = p; }
    }
    if (!best) break;
    cx = best.x; cy = best.y; wx /= 3; wy /= 3;
  }
  if (!best) { let sx = 0, sy = 0; for (const p of poly) { sx += p.x; sy += p.y; } best = { x: sx / poly.length, y: sy / poly.length }; }
  return best;
}

/* ---------- formats ---------- */
const NF = (d) => new Intl.NumberFormat('fr-FR', { minimumFractionDigits: d, maximumFractionDigits: d });
const NF0 = NF(0), NF1 = NF(1), NF2 = NF(2);
const NFc = new Intl.NumberFormat('fr-FR', { minimumFractionDigits: 0, maximumFractionDigits: 1 });
function fmtLen(cm, unit) {
  const u = unit || S.unit;
  if (u === 'cm') return NFc.format(Math.round(cm * 10) / 10);
  return NF2.format(cm / 100);
}
function fmtLenU(cm) { return S.unit === 'cm' ? fmtLen(cm) + ' cm' : fmtLen(cm) + ' m'; }
function fmtArea(cm2) { return NF2.format(cm2 / 10000) + ' m²'; }

/* ---------- réglages (par appareil) ---------- */
const S = {
  grid: 5, ortho: true, magnet: true, unit: 'm', dimMode: 'faces',
  layers: { grid: true, dims: true, areas: true, furn: true, elec: true, ghost: true, names: true },
  thMur: 20, thCloison: 7, wallEnd: 'auto',
  filt: { off: [], circ: null }, ductSys: 'vmc',
};
function loadSettings() {
  try {
    const raw = localStorage.getItem('calque.settings');
    if (raw) { const o = JSON.parse(raw); Object.assign(S, o, { layers: Object.assign({}, S.layers, o.layers || {}) }); }
  } catch (e) { /* stockage indisponible */ }
  if (!S.filt || typeof S.filt !== 'object' || !Array.isArray(S.filt.off)) S.filt = { off: [], circ: null };
  if (S.ductSys !== 'vmc' && S.ductSys !== 'elec') S.ductSys = 'vmc';
}
function saveSettings() { try { localStorage.setItem('calque.settings', JSON.stringify(S)); } catch (e) { } }

/* ---------- modèle ---------- */
let P = null;          // plan courant
const IDX = { nodes: new Map(), walls: new Map(), openings: new Map(), items: new Map(), elec: new Map(), rooms: new Map(), dims: new Map(), texts: new Map(), levels: new Map(), ducts: new Map() };
let GEO = {};          // géométrie dérivée par niveau

function blankPlan(name) {
  return {
    v: 1, name: name || 'Nouveau plan',
    levels: [{ id: 'L0', name: 'Rez-de-chaussée', elev: 0, h: 250, slab: 20 }],
    nodes: [], walls: [], openings: [], items: [], elec: [], rooms: [], dims: [], texts: [],
    circuits: [], rcds: [], links: [], ducts: [], install: { kva: 9, parafoudre: false, row: 13 },
  };
}
function normalizePlan(p) {
  const b = blankPlan(p && p.name);
  const o = Object.assign(b, p || {});
  for (const k of ['levels', 'nodes', 'walls', 'openings', 'items', 'elec', 'rooms', 'dims', 'texts', 'circuits', 'rcds', 'links', 'ducts']) if (!Array.isArray(o[k])) o[k] = [];
  o.ducts = o.ducts.filter((d) => d && Array.isArray(d.pts) && d.pts.length >= 2);
  if (!o.install || typeof o.install !== 'object') o.install = { kva: 9, parafoudre: false, row: 13 };
  if (!o.levels.length) o.levels = blankPlan().levels;
  return o;
}
function touch() {
  for (const k of ['nodes', 'walls', 'openings', 'items', 'elec', 'rooms', 'dims', 'texts', 'levels', 'ducts']) {
    const m = IDX[k]; m.clear();
    for (const o of P[k]) m.set(o.id, o);
  }
  GEO = {};
}
const nodeOf = (id) => IDX.nodes.get(id);
const levelOf = (id) => IDX.levels.get(id);
function levelsSorted() { return P.levels.slice().sort((a, b) => a.elev - b.elev); }
function levelAbove(lv) { const L = levelsSorted(); const i = L.findIndex((l) => l.id === lv); return i >= 0 && i < L.length - 1 ? L[i + 1] : null; }
function levelBelow(lv) { const L = levelsSorted(); const i = L.findIndex((l) => l.id === lv); return i > 0 ? L[i - 1] : null; }
function climbHeight(lv) {
  const l = levelOf(lv), up = levelAbove(lv);
  if (up) return up.elev - l.elev;
  return (l.h || 250) + (l.slab || 20);
}

/* ============================================================
   GÉOMÉTRIE DES MURS : jonctions propres + détection des pièces
   ============================================================ */
function geo(lv) { return GEO[lv] || (GEO[lv] = computeLevel(lv)); }

function computeLevel(lv) {
  const nodes = new Map();
  for (const n of P.nodes) if (n.lv === lv) nodes.set(n.id, n);
  const W = new Map();
  const inc = new Map();
  const pushInc = (id, h) => { let a = inc.get(id); if (!a) inc.set(id, (a = [])); a.push(h); };
  for (const w of P.walls) {
    if (w.lv !== lv || w.a === w.b) continue;
    const A = nodes.get(w.a), B = nodes.get(w.b);
    if (!A || !B) continue;
    const L = vdist(A, B);
    if (L < 0.5) continue;
    const d = vnorm(vsub(B, A));
    const g = { w, A, B, L, d, n: vperp(d), th: Math.max(1, w.th || 10), ang: vang(d) };
    const h0 = { g, from: w.a, to: w.b, dir: d, ang: vang(d), P: null, N: null, cap: false };
    const nd = vmul(d, -1);
    const h1 = { g, from: w.b, to: w.a, dir: nd, ang: vang(nd), P: null, N: null, cap: false };
    h0.twin = h1; h1.twin = h0; g.h0 = h0; g.h1 = h1;
    W.set(w.id, g);
    pushInc(w.a, h0); pushInc(w.b, h1);
  }
  // coins de jonction
  const hubs = [];
  for (const [nid, list] of inc) {
    const O = nodes.get(nid);
    list.sort((a, b) => a.ang - b.ang);
    const k = list.length;
    if (k === 1) {
      const h = list[0], n = vperp(h.dir), t = h.g.th / 2;
      h.P = vadd(O, vmul(n, t)); h.N = vsub(O, vmul(n, t)); h.cap = true;
      continue;
    }
    for (let i = 0; i < k; i++) {
      const e = list[i], f = list[(i + 1) % k];
      const ne = vperp(e.dir), nf = vperp(f.dir);
      const te = e.g.th / 2, tf = f.g.th / 2;
      const pe = vadd(O, vmul(ne, te)), pf = vsub(O, vmul(nf, tf));
      let da = f.ang - e.ang; if (i === k - 1) da += 2 * Math.PI;
      let pt = lineX(pe, e.dir, pf, f.dir);
      const lim = 4 * Math.max(te, tf);
      if (!pt || vdist(pt, O) > lim) {
        if (!pt || Math.abs(da - Math.PI) < 0.35) pt = vmid(pe, pf);
        else pt = vadd(O, vmul(vnorm(vsub(pt, O)), lim));
      }
      e.P = pt; f.N = pt;
    }
    if (k >= 3) hubs.push({ pts: list.map((h) => h.P), mur: list.some((h) => h.g.w.kind !== 'cloison') });
  }
  // polygones des murs + dégagements utiles (pour borner les ouvertures)
  for (const g of W.values()) {
    const { h0, h1, A, d, L } = g;
    g.poly = [h0.P, h1.N, h1.P, h0.N];
    g.faceP = [h0.P, h1.N]; // côté +n
    g.faceN = [h1.P, h0.N]; // côté -n
    const pr = (p) => vdot(vsub(p, A), d);
    g.clear0 = h0.cap ? 0 : Math.max(0, pr(h0.P), pr(h0.N));
    g.clear1 = h1.cap ? L : Math.min(L, pr(h1.P), pr(h1.N));
    if (g.clear1 < g.clear0) { const m = (g.clear0 + g.clear1) / 2; g.clear0 = g.clear1 = m; }
  }
  // faces (parcours du graphe planaire)
  const faces = [];
  const visited = new Set();
  for (const g of W.values()) for (const h of [g.h0, g.h1]) {
    if (visited.has(h)) continue;
    const loop = [], poly = [], hes = [];
    let cur = h, guard = 0;
    do {
      visited.add(cur); hes.push(cur);
      const list = inc.get(cur.to);
      const r = cur.twin;
      const idx = list.indexOf(r);
      const e = list[(idx - 1 + list.length) % list.length];
      poly.push(r.N);
      if (e.P !== r.N) poly.push(e.P);
      loop.push(nodes.get(cur.to));
      cur = e;
    } while (cur !== h && ++guard < 20000);
    faces.push({ hes, loop, poly, aLoop: polyArea(loop), aPoly: polyArea(poly) });
  }
  // composantes connexes
  const comp = new Map();
  const find = (x) => { while (comp.get(x) !== x) { comp.set(x, comp.get(comp.get(x))); x = comp.get(x); } return x; };
  for (const id of inc.keys()) comp.set(id, id);
  for (const g of W.values()) { const a = find(g.w.a), b = find(g.w.b); if (a !== b) comp.set(a, b); }
  // Les faces bornées ont une aire signée positive (voir test de calibration)
  const rooms = [], outers = [];
  for (const f of faces) {
    f.comp = find(f.hes[0].from);
    if (f.aLoop > 1 && f.aPoly > 1000) rooms.push(f);
    else if (f.aPoly < 0) outers.push(f);
  }
  for (const r of rooms) { r.holes = []; r.area = r.aPoly; r.perim = polyPerim(r.poly); }
  for (const o of outers) {
    let best = null;
    for (const r of rooms) {
      if (r.comp === o.comp) continue;
      if (!inPoly(o.loop[0] || o.poly[0], r.loop)) continue;
      if (!best || r.aLoop < best.aLoop) best = r;
    }
    if (best) { best.holes.push(o.poly); best.area -= Math.abs(o.aPoly); }
  }
  // association des étiquettes (sans mutation)
  const labels = P.rooms.filter((r) => r.lv === lv);
  const used = new Set();
  for (const r of rooms) {
    r.label = labels.find((l) => !used.has(l) && inPoly(l, r.loop)) || null;
    if (r.label) used.add(r.label);
  }
  return { lv, nodes, walls: W, inc, rooms, outers, hubs };
}

function syncRooms() {
  const keep = new Set();
  for (const L of P.levels) {
    const g = geo(L.id);
    for (const r of g.rooms) {
      if (!r.label) {
        const pt = labelPoint(r.poly);
        r.label = { id: uid('r'), lv: L.id, name: nextRoomName(), x: Math.round(pt.x), y: Math.round(pt.y) };
        P.rooms.push(r.label);
      }
      keep.add(r.label.id);
    }
  }
  const before = P.rooms.length;
  P.rooms = P.rooms.filter((r) => keep.has(r.id));
  if (before !== P.rooms.length || true) { IDX.rooms.clear(); for (const r of P.rooms) IDX.rooms.set(r.id, r); }
}
function nextRoomName() {
  let n = 1;
  const names = new Set(P.rooms.map((r) => r.name));
  while (names.has('Pièce ' + n)) n++;
  return 'Pièce ' + n;
}
function roomOfLabel(lbl) {
  const g = geo(lbl.lv);
  return g.rooms.find((r) => r.label === lbl) || null;
}

/* ============================================================
   MUTATIONS DES MURS
   ============================================================ */
function addNode(lv, x, y) {
  const n = { id: uid('n'), lv, x: Math.round(x * 10) / 10, y: Math.round(y * 10) / 10 };
  P.nodes.push(n); IDX.nodes.set(n.id, n); GEO = {};
  return n;
}
function wallsAt(nodeId) { return P.walls.filter((w) => w.a === nodeId || w.b === nodeId); }
function findNodeNear(lv, p, tol, exclude) {
  let best = null, bd = tol;
  for (const n of P.nodes) {
    if (n.lv !== lv || n.id === exclude) continue;
    const d = vdist(n, p);
    if (d <= bd) { bd = d; best = n; }
  }
  return best;
}
function findWallNear(lv, p, tol, excludeNode) {
  let best = null, bd = tol;
  for (const w of P.walls) {
    if (w.lv !== lv) continue;
    if (excludeNode && (w.a === excludeNode || w.b === excludeNode)) continue;
    const A = nodeOf(w.a), B = nodeOf(w.b);
    if (!A || !B) continue;
    const pr = projSeg(p, A, B);
    if (pr.t <= 0.001 || pr.t >= 0.999) continue;
    if (pr.d <= bd) { bd = pr.d; best = { w, pt: pr.pt, t: pr.t, d: pr.d }; }
  }
  return best;
}
function newWall(lv, a, b, props) {
  if (a === b) return null;
  if (P.walls.some((w) => w.lv === lv && ((w.a === a && w.b === b) || (w.a === b && w.b === a)))) return null;
  const w = { id: uid('w'), lv, a, b, th: props.th, kind: props.kind || 'mur' };
  P.walls.push(w); IDX.walls.set(w.id, w); GEO = {};
  return w;
}
/* coupe un mur en un point (projeté) : renvoie l'id du nouveau nœud */
function splitWall(w, p) {
  const A = nodeOf(w.a), B = nodeOf(w.b);
  const pr = projSeg(p, A, B);
  const n = addNode(w.lv, pr.pt.x, pr.pt.y);
  const L = vdist(A, B), cut = pr.tc * L;
  const w2 = { id: uid('w'), lv: w.lv, a: n.id, b: w.b, th: w.th, kind: w.kind };
  if (w.h) w2.h = w.h;

{ const ci = (d) => ELEC_CATS.findIndex((x) => x.id === d.cat); ELEC.sort((a, b) => ci(a) - ci(b)); }
const ELEC_BY = new Map(ELEC.map((e) => [e.t, e]));
function elecSize(K) { return Math.max(S_ELEC, 20 * K.px); }
function drawElec(c, e, K) {
  const def = ELEC_BY.get(e.type); if (!def) return;
  const u = elecSize(K);
  c.save();
  c.translate(e.x, e.y); c.rotate((e.rot || 0) * DEG);
  c.scale(u, u);
  const K2 = Object.assign({}, K, { px: K.px / u, unit: u });
  c.lineWidth = 1.3 * K2.px; c.strokeStyle = K.elec; c.lineJoin = 'round'; c.lineCap = 'round';
  K2.flipText = needsFlip(e.rot);
  def.draw(c, K2);
  c.restore();
}
function elecBox(e, K) {
  const def = ELEC_BY.get(e.type); const u = elecSize(K);
  if (!def) return { x0: -u / 2, y0: -u / 2, x1: u / 2, y1: u / 2 };
  const wide = ['tableau', 'reglette', 'led', 'rad_elec', 'com'].includes(e.type);
  const hw = (def.bw || (wide ? 0.72 : 0.5)) * u;
  return def.wall ? { x0: -hw, y0: -0.05 * u, x1: hw, y1: 0.85 * u } : { x0: -hw, y0: -0.4 * u, x1: hw, y1: 0.4 * u };
}
function needsFlip(rot) { const r = normDeg(rot || 0); return r > 90.5 && r <= 270.5; }

function assignRcds() {
  const circs = P.circuits;
  const R = [];
  const mkR = (type, extra) => { const r = Object.assign({ id: uid('d'), type, cal: 40 }, extra || {}); R.push(r); return r; };
  for (const c of circs) c.rcd = null;
  const irve = circs.filter((c) => CK[c.kind] && CK[c.kind].ownRcd);
  const needA = circs.filter((c) => CK[c.kind] && CK[c.kind].typeA && !CK[c.kind].ownRcd);
  const others = circs.filter((c) => !(CK[c.kind] && CK[c.kind].typeA));
  const load = (list) => list.reduce((s, c) => s + circLoad(c), 0);
  // type A : cuisson, lave-linge
  let aGroups = [];
  if (needA.length) {
    let cur = []; aGroups.push(cur);
    for (const c of needA) { if (cur.length >= 8 || load(cur) + circLoad(c) > 63) { cur = []; aGroups.push(cur); } cur.push(c); }
  }
  // type AC : le reste, réparti pour rester à 40 A quand c'est possible
  // deux façons d'être conforme : calibre ≥ réglage de l'AGCP (63 A), ou calibre ≥ somme pondérée (40 A)
  const agcp = agcpOf((P.install || defaultInstall()).kva)[1];
  let nAC = Math.max(others.length ? 1 : 0, Math.ceil(others.length / 8), Math.ceil(load(others) / 40));

  if (agcp <= 63 && n63 < nAC) nAC = n63;

  const pick = (c, prefer) => {
    let best = -1;
    for (let i = 0; i < acs.length; i++) {
      if (acs[i].length >= 8) continue;
      if (best < 0) { best = i; continue; }
      const a = load(acs[i]) + circLoad(c), b = load(acs[best]) + circLoad(c);
      if (prefer != null && i === prefer && acs[i].length < 8) { best = i; break; }
      if (a < b - 0.01 || (Math.abs(a - b) < 0.01 && acs[i].length < acs[best].length)) best = i;

  for (const g of used) { const r = mkR('AC'); for (const c of g) c.rcd = r.id; }
  for (const g of aGroups) { const r = mkR('A'); for (const c of g) c.rcd = r.id; }
  for (const c of irve) { const r = mkR('A', { own: true }); c.rcd = r.id; }

  const lp = circs.filter((c) => c.kind === 'eclairage' || c.kind === 'prises');
  const hosts = new Set(lp.map((c) => c.rcd));
  if (lp.length >= 2 && hosts.size < 2) {
    const target = R.find((r) => !r.own && !hosts.has(r.id) && rcdCircuitsIn(circs, r.id).length < 8);

    if (target) mover.rcd = target.id;

/* ---------------- organisation du tableau ---------------- */
function panelLayout() {
  const inst = P.install || defaultInstall();
  const rowMods = inst.row || 13;
  const nums = circNumbers(), rn = rcdNumbers();
  const blocks = [];
  if (inst.parafoudre) blocks.push([{ k: 'pf', w: 2 }]);
  for (const r of P.rcds) {
    const b = [{ k: 'id', w: 2, r, label: rn.get(r.id) }];
    for (const c of rcdCircuits(r.id)) {
      b.push({ k: 'cb', w: 1, c, label: nums.get(c.id) });
      if (c.dda) b.push({ k: 'dda', w: 1, c });
      if (c.ctrl === 'contacteur') b.push({ k: 'km', w: 1, c });
      if (c.ctrl === 'telerupteur') b.push({ k: 'tl', w: 1, c });
      if (c.ctrl === 'minuterie') b.push({ k: 'mn', w: 1, c });
    }
    blocks.push(b);
  }
  const orphans = P.circuits.filter((c) => !rcdById(c.rcd));
  if (orphans.length) blocks.push(orphans.map((c) => ({ k: 'cb', w: 1, c, label: nums.get(c.id), orphan: true })));
  const rows = [];
  let cur = null;
  for (const b of blocks) {
    const bw = b.reduce((s, m) => s + m.w, 0);
    if (!cur || (bw <= rowMods && cur.used + bw > rowMods) || (bw <= rowMods && cur.used > 0 && b[0].k === 'id')) { cur = { mods: [], used: 0 }; rows.push(cur); }
    for (const m of b) { if (cur.used + m.w > rowMods) { cur = { mods: [], used: 0 }; rows.push(cur); } cur.mods.push(m); cur.used += m.w; }
  }
  let used = rows.reduce((s, r) => s + r.used, 0);
  while (rows.length * rowMods - used < Math.ceil(rows.length * rowMods * 0.2) || !rows.length) rows.push({ mods: [], used: 0 });

  return { rows, rowMods, used, total, free: total - used, reserve: (total - used) / total };
}

  add(inst.parafoudre ? 'ok' : 'info', G1, inst.parafoudre ? 'Parafoudre prévu en tête du tableau (In ≥ 5 kA).' : 'Pas de parafoudre : il est obligatoire si le bâtiment a un paratonnerre et dans certaines zones exposées à la foudre.', null);

  const mainRooms = [];

    else add('ok', G2, `${nSpec} circuits spécialisés.`, null);
    const hasKitchen = P.rooms.some((r) => /cuisine/i.test(r.name));
    if (hasKitchen && !circs.some((c) => c.kind === 'cuisson')) add('err', G2, 'Pas de circuit de cuisson : une sortie 32 A en 6 mm² est obligatoire dans la cuisine.', null);

    if (circStats(c).ms.some((e) => { const r = roomAt(e); return r && r.label && /chambre/i.test(r.label.name); })) add('info', G2, `${nums.get(c.id)} ${c.name} dessert une chambre : un détecteur d'arc (DDA) est recommandé.`, { t: 'circuit', id: c.id });

      const name = r.label.name, area = r.area / 10000, ref = { t: 'room', id: r.label.id, lv: L.id };

        const hot = P.items.filter((it) => it.lv === L.id && /^(evier1|evier2|evier_eg|plaque|plaque90)$/.test(it.type));
        for (const e of inside.filter((x) => x.type in SOCKETS || isSpecOutlet(x.type))) {

  for (const e of P.elec) {

}

function floorName() {

function addLevel(mode) {
  const L = levelsSorted();

    const b = L[0];
    lvl = { id: uid('L'), name: P.levels.some((l) => l.name === 'Sous-sol') ? 'Sous-sol 2' : 'Sous-sol', elev: b.elev - 250, h: 230, slab: 20 };

  }

function copyWalls(src, dst) {
  const map = new Map();
  for (const w of P.walls.filter((x) => x.lv === src && x.kind === 'mur')) {
    for (const nid of [w.a, w.b]) if (!map.has(nid)) { const n = nodeOf(nid); const m = { id: uid('n'), lv: dst, x: n.x, y: n.y }; P.nodes.push(m); map.set(nid, m.id); }
    const nw = { id: uid('w'), lv: dst, a: map.get(w.a), b: map.get(w.b), th: w.th, kind: w.kind };
    P.walls.push(nw);
    for (const o of P.openings.filter((x) => x.wall === w.id && x.kind === 'window')) P.openings.push(Object.assign({}, o, { id: uid('o'), wall: nw.id }));
  }
  touch();
  // fusionner les nœuds colinéaires créés par les cloisons absentes
  for (const n of P.nodes.filter((x) => x.lv === dst)) if (wallsAt(n.id).length === 2) mergeAtNode(n.id, true);
  touch();
}
function deleteLevel(id) {
  if (P.levels.length < 2) return;
  const wallIds = new Set(P.walls.filter((w) => w.lv === id).map((w) => w.id));
  P.openings = P.openings.filter((o) => !wallIds.has(o.wall));
  for (const k of ['nodes', 'walls', 'items', 'elec', 'rooms', 'dims', 'texts', 'links', 'ducts']) P[k] = P[k].filter((o) => o.lv !== id);
  for (const c of P.circuits) if (!P.elec.some((e) => e.cid === c.id)) { /* circuit conservé, sans symbole */ }
  P.levels = P.levels.filter((l) => l.id !== id);
  touch();
  ui.lv = levelsSorted().reduce((best, l) => (Math.abs(l.elev) < Math.abs(best.elev) ? l : best)).id;
  ui.sel = null;
  commit();
}

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { } }

const Store = {
  cloud: false, col: null, cache: new Map(), timer: 0, saving: false, again: false,
  async init() {
    try {
      if (!window.claude || typeof window.claude.use !== 'function') return false;
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return false;
      const id = await user.id();
      if (!id) return false;
      this.col = db.collection('data/users/' + id);
      this.cloud = true;
      return true;
    } catch (e) { return false; }
  },
  async refresh() {
    if (!this.cloud) return;
    const snap = await this.col.get();
    this.cache.clear();
    for (const d of snap.docs) {
      if (!d.exists || !d.id.startsWith('p_')) continue;
      const x = d.data() || {};
      this.cache.set(d.id.slice(2), { id: d.id.slice(2), name: x.name || 'Plan', savedAt: x.savedAt || 0, json: x.json });
    }
  },
};

}
async function saveNow() {
  clearTimeout(Store.timer);
  if (!P || ui.isExample) return;
  const id = P.id, name = P.name || 'Plan', savedAt = ui.savedAt || Date.now();
  const json = JSON.stringify(P);
  lsSet('calque.p.' + id, json);
  const idx = localIndex().filter((x) => x.id !== id); idx.push({ id, name, savedAt }); setLocalIndex(idx);
  lsSet('calque.cur', id);
  if (!Store.cloud) { setSave('local'); return; }
  if (Store.saving) { Store.again = true; return; }
  if (json.length > 240000) { setSave('err', 'Plan trop lourd pour l’enregistrement en ligne'); return; }
  Store.saving = true;
  try {
    await Store.col.doc('p_' + id).set({ name, savedAt, json });
    Store.cache.set(id, { id, name, savedAt, json });
    setSave('ok');
  } catch (e) {
    if (e && e.code === 'unavailable') { setTimeout(() => { if (!Store.saving) saveNow(); }, 1500 + Math.random() * 1000); }
    setSave('err', e && e.code === 'quota_exceeded' ? 'Espace en ligne plein' : 'Enregistré sur cet appareil seulement');

}

  lk(at('int_s', 300, 453.5), at('pl', 170, 620));
  lk(at('int_s', 505, 790), at('pl', 445, 640)); lk(at('int_s', 505, 790), at('hublot', 400, 810));
  lk(at('int_vv', 563.5, 680), at('pl', 630, 560));
  lk(at('int_s', 690, 376.5), at('pl', 800, 200));
  lk(S_.sdb, at('applique', 790, 383.5)); lk(S_.sdb, at('pl', 915, 505));
  lk(S_.wc, at('pl', 765, 702)); lk(S_.bua, at('pl', 935, 735));
  const vk = (a, b2, mid, dia) => { if (a && b2) P.ducts.push({ id: uid('k'), lv: 'L0', sys: 'vmc', mat: 'souple', a: a.id, b: b2.id, dia, pts: [{ x: a.x, y: a.y }, ...mid, { x: b2.x, y: b2.y }] }); };
  vk(vmcG, at('vmc', 280, 500), [{ x: 600, y: 650 }, { x: 600, y: 500 }], 125);
  vk(vmcG, at('vmc', 750, 425), [{ x: 665, y: 650 }, { x: 665, y: 425 }], 80);
  vk(vmcG, at('vmc', 805, 645), [{ x: 635, y: 700 }, { x: 805, y: 700 }], 80);
  vk(vmcG, vmcR, [], 160);
  copyWalls('L0', 'L1');
  syncRooms();
  const name = (x, y, n, lv) => { const g = geo(lv || 'L0'); const r = g.rooms.find((q) => inPoly({ x, y }, q.loop)); if (r && r.label) { r.label.name = n; r.label.x = x; r.label.y = y; } };
  name(150, 395, 'Séjour'); name(175, 560, 'Cuisine'); name(445, 600, 'Entrée'); name(630, 520, 'Dégagement');
  name(860, 150, 'Chambre'); name(790, 505, 'Salle de bain'); name(765, 650, 'WC'); name(880, 690, 'Buanderie');
  name(760, 250, 'Combles aménageables', 'L1');
  const lab = P.rooms.find((r) => r.name === 'Séjour'); if (lab) lab.tint = 1;
  const lab2 = P.rooms.find((r) => r.name === 'Salle de bain'); if (lab2) lab2.tint = 3;
  touch();
  generateFromPlan();
  return JSON.parse(JSON.stringify(P));
}

/* ---------------- clavier ---------------- */
window.addEventListener('keydown', (e) => {
  if (e.key === 'Shift') keys.shift = true;
  const tag = e.target && e.target.tagName;
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') { if (e.key === 'Escape') e.target.blur(); return; }
  if (!$('#modal').hidden) { if (e.key === 'Escape') closeModal(); return; }
  const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
  if (ui.view === '3d') {
    if (mod && k === 'z') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
    if (mod && k === 'y') { e.preventDefault(); redo(); return; }
    if (!mod) v3Key3(e);
    return;
  }
  if (mod && k === 'z') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
  if (mod && k === 'y') { e.preventDefault(); redo(); return; }
  if (mod && k === 'd') { e.preventDefault(); duplicateSel(); return; }
  if (mod) return;
  if (k === ' ') { keys.space = true; e.preventDefault(); return; }
  if (k === 'escape') { closePops(); closeDimEdit(); if (ui.duct) { ui.duct = null; updateHint(); requestRender(); return; } if (ui.chain) finishChain(); else if (ui.tool !== 'select') setTool('select'); else select(null); return; }
  if (k === 'delete' || k === 'backspace') { e.preventDefault(); deleteSel(); return; }
  if (k === 'enter' && ui.chain) { finishChain(); return; }
  if (k === 'enter' && ui.duct) { finishDuct(); return; }
  const step = e.shiftKey ? 10 : 1;
  if (k === 'arrowleft') { e.preventDefault(); nudgeSel(-step, 0); return; }
  if (k === 'arrowright') { e.preventDefault(); nudgeSel(step, 0); return; }
  if (k === 'arrowup') { e.preventDefault(); nudgeSel(0, -step); return; }
  if (k === 'arrowdown') { e.preventDefault(); nudgeSel(0, step); return; }
  const map = { v: 'select', m: 'wall', p: 'room', o: 'door', f: 'window', c: 'dim', t: 'text', l: 'link', g: 'duct' };
  if (map[k]) { setTool(map[k]); return; }
  if (k === 'r') rotateSel(90);
});
window.addEventListener('keyup', (e) => { if (e.key === ' ') keys.space = false; if (e.key === 'Shift') keys.shift = false; if (ui.view === '3d') v3Key3(e); });
window.addEventListener('blur', () => { keys.space = false; keys.shift = false; V3.keys.clear(); });

/* ---------------- démarrage ---------------- */
function bindUI() {
  for (const b of $$('.tool')) b.addEventListener('click', () => setTool(b.dataset.tool));
  $('#btnUndo').addEventListener('click', undo);
  $('#btnRedo').addEventListener('click', redo);
  $('#btnFilter').addEventListener('click', (e) => openFilterPop(e.currentTarget));
  $('#btnView').addEventListener('click', (e) => { const p = $('#viewPop'); if (!p.hidden) { closePops(); return; } renderViewPop(); showPop(p, e.currentTarget); });
  $('#btnMenu').addEventListener('click', (e) => { const p = $('#menuPop'); if (!p.hidden) { closePops(); return; } renderMenuPop(); showPop(p, e.currentTarget); });
  $('#btnProj').addEventListener('click', openProjects);
  $('#btnExport').addEventListener('click', openExport);
  for (const b of $$('.vtab')) b.addEventListener('click', () => setView(b.dataset.view));
  window.addEventListener('resize', () => { if (ui.view === 'elec') renderEvMain(); });
  $('#zIn').addEventListener('click', () => zoomAt(SCR.w / 2, SCR.h / 2, 1.25));
  $('#zOut').addEventListener('click', () => zoomAt(SCR.w / 2, SCR.h / 2, 0.8));
  $('#zFit').addEventListener('click', fitView);
  const info = h('button', { class: 'ib info', type: 'button', 'aria-label': 'Niveau et légende', title: 'Niveau et légende', html: ICON.info, onclick: () => { ui.inspOpen = !ui.inspOpen || !!ui.sel; ui.sel = null; renderInspector(); requestRender(); } });
  $('.zoom').prepend(info);
  const onTheme = () => { readColors(); requestRender(); renderInspector(); if (ui.view === '3d') v3Refresh(); };
  try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', onTheme); } catch (e) { }
  new MutationObserver(onTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'class', 'style'] });
  new ResizeObserver(resizeCanvas).observe($('#stage'));
  window.addEventListener('resize', () => { closePops(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => requestRender());
  window.addEventListener('beforeunload', () => { if (Store.timer) saveNow(); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && Store.timer) saveNow(); });
}
async function boot() {
  loadSettings();
  readColors();
  bindUI();
  const curId = lsGet('calque.cur');
  let raw = curId && lsGet('calque.p.' + curId);
  let ok = false;
  if (raw) { try { const li = localIndex().find((x) => x.id === curId); openPlan(JSON.parse(raw), curId, { savedAt: li ? li.savedAt : 0 }); ok = true; } catch (e) { } }
  if (!ok) openPlan(samplePlan(), uid('p'), { example: true });
  resizeCanvas();
  { const vw = lsGet('calque.view'); if (vw === 'elec' || vw === '3d') setView(vw); }
  getDownloads();
  const cloud = await Store.init();
  if (!cloud) { if (!ui.isExample) setSave('local'); return; }
  try {
    await Store.refresh();
    const list = [...Store.cache.values()].sort((a, b) => b.savedAt - a.savedAt);
    const mine = Store.cache.get(P.id);
    const untouched = H.u.length === 0;
    if (mine && untouched && mine.savedAt > (ui.savedAt || 0) && mine.json) openPlan(JSON.parse(mine.json), mine.id, { savedAt: mine.savedAt });
    else if (!mine && ui.isExample && untouched && list.length && list[0].json) openPlan(JSON.parse(list[0].json), list[0].id, { savedAt: list[0].savedAt });
    else if (!mine && !ui.isExample) saveNow();
    else if (!ui.isExample) setSave('ok');
  } catch (e) { if (!ui.isExample) setSave('local'); }
}
boot();
})();
