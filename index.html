<style>
/* Mise en page : atelier plein écran — outils | calque de dessin | inspecteur */
:root {
  --chrome: #E4E7E3; --panel: #F8F9F7; --panel-2: #EDF0EC; --ink: #1A1E22; --ink-2: #59626A; --ink-3: #8A939A; --rule: #D0D5D0;
  --accent: #D24F1A; --accent-ink: #A63D10; --on-accent: #FFFFFF; --accent-soft: rgba(210, 79, 26, .11);
  --elec: #2356C4; --ok: #2D7A4C; --warn: #A86E12; --bad: #BF3428; --shadow: 0 10px 30px rgba(20, 30, 28, .14), 0 2px 6px rgba(20, 30, 28, .08);
  --c-paper: #ECEFEB; --c-room: #FFFFFF; --c-ink: #1D2125; --c-ink2: #5C656C; --c-wall: #252A2F; --c-part: #98A0A6; --c-fill: #FFFFFF; --c-tone: #E5E8E3;
  --c-grid: rgba(30, 44, 40, .06); --c-gridMajor: rgba(30, 44, 40, .13); --c-accent: #D24F1A; --c-accentSoft: rgba(210, 79, 26, .12); --c-elec: #2356C4; --c-ghost: rgba(30, 44, 40, .11);
  --c-vmc: #0B8C88; --c-gaine: #6D4FC2;
  --c-t1: rgba(214, 165, 80, .22); --c-t2: rgba(96, 160, 104, .2); --c-t3: rgba(80, 146, 214, .18); --c-t4: rgba(222, 110, 132, .18); --c-t5: rgba(146, 114, 214, .18); --c-t6: rgba(84, 96, 108, .16);
  --f-ui: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num: "Archivo Narrow", "Arial Narrow", system-ui, sans-serif;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --chrome: #101215; --panel: #181B1F; --panel-2: #1F2328; --ink: #E5E8E4; --ink-2: #A0A9AF; --ink-3: #6E777E; --rule: #2B3036;
    --accent: #FF7A3E; --accent-ink: #FF9663; --on-accent: #1A0E07; --accent-soft: rgba(255, 122, 62, .14);
    --elec: #7FA8FF; --ok: #5BC38A; --warn: #E2AE4E; --bad: #FF7468; --shadow: 0 10px 30px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .3);
    --c-paper: #14171A; --c-room: #1C2024; --c-ink: #E2E5E1; --c-ink2: #9AA3AA; --c-wall: #D5D9D4; --c-part: #6C757B; --c-fill: #1C2024; --c-tone: #292E33;
    --c-grid: rgba(220, 230, 225, .045); --c-gridMajor: rgba(220, 230, 225, .1); --c-accent: #FF7A3E; --c-accentSoft: rgba(255, 122, 62, .16); --c-elec: #7FA8FF; --c-ghost: rgba(220, 230, 225, .1);
    --c-vmc: #3DD3C9; --c-gaine: #A993FF;
    --c-t1: rgba(214, 165, 80, .16); --c-t2: rgba(110, 180, 118, .14); --c-t3: rgba(96, 160, 230, .14); --c-t4: rgba(230, 120, 140, .14); --c-t5: rgba(160, 130, 230, .14); --c-t6: rgba(160, 170, 180, .1);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --chrome: #101215; --panel: #181B1F; --panel-2: #1F2328; --ink: #E5E8E4; --ink-2: #A0A9AF; --ink-3: #6E777E; --rule: #2B3036;
  --accent: #FF7A3E; --accent-ink: #FF9663; --on-accent: #1A0E07; --accent-soft: rgba(255, 122, 62, .14);
  --elec: #7FA8FF; --ok: #5BC38A; --warn: #E2AE4E; --bad: #FF7468; --shadow: 0 10px 30px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .3);
  --c-paper: #14171A; --c-room: #1C2024; --c-ink: #E2E5E1; --c-ink2: #9AA3AA; --c-wall: #D5D9D4; --c-part: #6C757B; --c-fill: #1C2024; --c-tone: #292E33;
  --c-grid: rgba(220, 230, 225, .045); --c-gridMajor: rgba(220, 230, 225, .1); --c-accent: #FF7A3E; --c-accentSoft: rgba(255, 122, 62, .16); --c-elec: #7FA8FF; --c-ghost: rgba(220, 230, 225, .1);
  --c-vmc: #3DD3C9; --c-gaine: #A993FF;
    --c-t1: rgba(214, 165, 80, .16); --c-t2: rgba(110, 180, 118, .14); --c-t3: rgba(96, 160, 230, .14); --c-t4: rgba(230, 120, 140, .14); --c-t5: rgba(160, 130, 230, .14); --c-t6: rgba(160, 170, 180, .1);
  color-scheme: dark;
}
html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: border-box; }
body {
  height: 100%; margin: 0; overflow: hidden; background: var(--chrome); color: var(--ink);
  font-family: var(--f-ui); font-size: 14px; line-height: 1.35; -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 10px; padding-block: 10px; }

/* ---- barre du haut ---- */
.topbar { display: flex; align-items: center; gap: 8px; min-width: 0; }
.brand { font-weight: 800; font-stretch: 125%; letter-spacing: .1em; font-size: 15px; display: flex; align-items: center; gap: 8px; padding-right: 4px; white-space: nowrap; }
.brand svg { width: 22px; height: 22px; flex: none; }
.proj { display: flex; align-items: center; gap: 4px; min-width: 0; max-width: 260px; height: 36px; padding: 0 10px; border: 1px solid transparent; background: transparent; border-radius: 9px; font-weight: 600; }
.proj:hover { background: var(--panel-2); }
.proj span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proj svg { width: 14px; height: 14px; flex: none; opacity: .6; }
.levels { position: relative; display: flex; align-items: center; gap: 4px; padding: 3px; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.levels::-webkit-scrollbar { display: none; }
.lvl { height: 30px; padding: 0 11px; border: 0; border-radius: 7px; background: transparent; white-space: nowrap; font-weight: 600; font-size: 13px; color: var(--ink-2); }
.lvl[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.lvl.add { width: 30px; padding: 0; display: grid; place-items: center; }
.spacer { flex: 1; }
.ib { width: 36px; height: 36px; display: grid; place-items: center; border: 1px solid var(--rule); background: var(--panel); border-radius: 9px; flex: none; }
.ib:hover { background: var(--panel-2); }
.ib:disabled { opacity: .35; cursor: default; }
.ib svg { width: 18px; height: 18px; }
.save { font-size: 12px; color: var(--ink-3); white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.save i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); display: inline-block; }
.save[data-s="dirty"] i { background: var(--warn); }
.save[data-s="local"] i { background: var(--ink-3); }
.save[data-s="err"] i { background: var(--bad); }

/* ---- zone principale ---- */
.main { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr) clamp(270px, 24vw, 310px); gap: 10px; min-height: 0; }
.toolbar { display: flex; flex-direction: column; gap: 2px; padding: 6px; background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r); overflow-y: auto; scrollbar-width: none; }
.tool { width: 62px; min-height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: 0; background: transparent; border-radius: 9px; color: var(--ink-2); font-size: 10.5px; font-weight: 600; padding: 4px 2px; flex: none; }
.tool svg { width: 22px; height: 22px; }
@media (max-height: 900px) { .tool { min-height: 47px; gap: 2px; } .tool svg { width: 20px; height: 20px; } .tsep { margin: 3px 6px; } }
.tool:hover { background: var(--panel-2); color: var(--ink); }
.tool[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-ink); }
.tsep { height: 1px; background: var(--rule); margin: 4px 6px; flex: none; }
.stage { position: relative; min-width: 0; min-height: 0; border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; background: var(--c-paper); }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }

/* bandeau d'aide contextuel */
.hint { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100% - 20px); display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 7px 8px 7px 12px; background: var(--panel); border: 1px solid var(--rule); border-radius: 11px; box-shadow: var(--shadow); font-size: 13px; z-index: 3; }
.hint b { font-weight: 700; }
.hint .msg { color: var(--ink-2); min-width: 0; }
.hint .grp { display: flex; align-items: center; gap: 4px; }
.hint input.txt { width: 88px; }
.hint .dirs { display: flex; gap: 2px; }
.hint .dirs button { width: 32px; height: 32px; border: 1px solid var(--rule); background: var(--panel-2); border-radius: 7px; display: grid; place-items: center; font-size: 15px; }

.zoom { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 4px; z-index: 2; }
.status { position: absolute; left: 10px; bottom: 10px; display: flex; align-items: center; gap: 10px; padding: 5px 10px; background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--rule); border-radius: 9px; font-family: var(--f-num); font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; z-index: 2; pointer-events: none; }
.scalebar { display: flex; flex-direction: column; gap: 2px; }
.scalebar i { display: block; height: 5px; border: 1.5px solid var(--ink-2); border-top: 0; }

/* ---- inspecteur ---- */
.insp { background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r); overflow-y: auto; min-height: 0; display: flex; flex-direction: column; }
.insp-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: flex-start; gap: 8px; padding: 14px 14px 10px; background: var(--panel); border-bottom: 1px solid var(--rule); }
.insp-head h2 { margin: 0; font-size: 15px; font-weight: 700; text-wrap: balance; }
.insp-head p { margin: 2px 0 0; font-size: 12px; color: var(--ink-2); }
.insp-head .x { margin-left: auto; width: 30px; height: 30px; border: 0; background: transparent; border-radius: 7px; display: none; place-items: center; }
.insp-body { padding: 12px 14px 18px; display: flex; flex-direction: column; gap: 14px; }
.sec { display: flex; flex-direction: column; gap: 8px; }
.sec h3 { margin: 0; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.row.r3 { grid-template-columns: 1fr 1fr 1fr; }
.fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fld > span { font-size: 12px; color: var(--ink-2); }
.inp { position: relative; display: flex; align-items: center; }
.inp input, .inp select, input.txt, select.txt { width: 100%; height: 34px; padding: 0 9px; border: 1px solid var(--rule); background: var(--c-room); border-radius: 8px; font-variant-numeric: tabular-nums; min-width: 0; }
.inp input.num { padding-right: 34px; font-family: var(--f-num); font-size: 15px; font-weight: 600; }
.inp em { position: absolute; right: 9px; font-style: normal; font-size: 12px; color: var(--ink-3); pointer-events: none; }
.inp input:focus, input.txt:focus, select.txt:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.ro { font-family: var(--f-num); font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.seg { display: flex; padding: 3px; gap: 2px; background: var(--panel-2); border: 1px solid var(--rule); border-radius: 9px; }
.seg button { flex: 1; min-height: 30px; padding: 0 6px; border: 0; border-radius: 6px; background: transparent; font-size: 13px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { height: 28px; padding: 0 9px; border: 1px solid var(--rule); background: var(--panel); border-radius: 14px; font-size: 12.5px; font-family: var(--f-num); font-weight: 600; color: var(--ink-2); }
.chip:hover { border-color: var(--ink-3); color: var(--ink); }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft); }
.btns { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { height: 34px; padding: 0 12px; border: 1px solid var(--rule); background: var(--panel); border-radius: 9px; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--panel-2); }
.btn svg { width: 16px; height: 16px; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.pri:hover { filter: brightness(1.05); }
.btn.danger { color: var(--bad); }
.btn.sm { height: 30px; padding: 0 10px; font-size: 12.5px; }
.note { font-size: 12.5px; color: var(--ink-2); margin: 0; }
.pill { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 12px; font-weight: 700; }
.pill.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
.pill.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 16%, transparent); }
.pill.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }
/* bibliothèque technique : désignations lisibles sur chantier, badge de fiabilité */
.badge { display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border-radius: 12px; font-size: 12px; font-weight: 700; white-space: nowrap; border: 1px solid transparent; }
.badge.b-verifiee { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
.badge.b-saisie { color: var(--elec); background: color-mix(in srgb, var(--elec) 11%, transparent); }
.badge.b-estimee { color: var(--warn); background: color-mix(in srgb, var(--warn) 16%, transparent); border-style: dashed; border-color: var(--warn); }
.art-list { display: flex; flex-direction: column; gap: 6px; }
.art-li { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 10px; background: var(--c-room); min-height: 44px; }
.art-li b { display: block; font-size: 15px; line-height: 1.25; }
.art-li small { display: block; color: var(--ink-3); font-size: 12px; margin-top: 2px; overflow-wrap: anywhere; }
.art-li .btn.sm { height: 36px; padding: 0 12px; }
.art-mini { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; margin-top: 8px; }
.art-mini-l { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.art-mini-l small { color: var(--ink-3); font-size: 12px; overflow-wrap: anywhere; }
.art-mini .btn.sm { height: 36px; }
.range-fld { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; }
.range-fld .v { font-family: var(--f-num); font-size: 13px; min-width: 42px; text-align: right; }
.range { width: 100%; height: 36px; accent-color: var(--accent); }
.card-add { justify-content: center; border-style: dashed; color: var(--accent-ink); }
.card-add .plus { font-size: 30px; line-height: 1; font-weight: 400; }
.cform { display: flex; flex-direction: column; gap: 10px; }
.cform .row { align-items: end; }
.cthumb { flex: none; width: 72px; height: 72px; border: 1px solid var(--rule); border-radius: 10px; display: grid; place-items: center; background: var(--c-room); }
.cthumb canvas { width: 64px; height: 64px; }
.csub { margin: 8px 0 0; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.fiab-legend { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--ink-2); }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 13px; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; font-family: var(--f-num); font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.list { display: flex; flex-direction: column; }
.li { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; padding: 7px 4px; border: 0; border-bottom: 1px solid var(--rule); background: transparent; text-align: left; font-size: 13px; }
.li:last-child { border-bottom: 0; }
.li .v { font-family: var(--f-num); font-weight: 600; font-variant-numeric: tabular-nums; }
.li canvas { width: 28px; height: 28px; }
.li .sw { width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--rule); }
.li.tot { font-weight: 700; border-top: 1px solid var(--ink-3); border-bottom: 0; }
button.li:hover { background: var(--panel-2); }
.tints { display: flex; gap: 6px; flex-wrap: wrap; }
.tints button { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--rule); position: relative; }
.tints button[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 1px; }
.tints button.none::after { content: ""; position: absolute; left: 4px; right: 4px; top: 50%; height: 1.5px; background: var(--ink-3); transform: rotate(-45deg); }
.empty-help { font-size: 13px; color: var(--ink-2); display: flex; flex-direction: column; gap: 8px; }
.empty-help kbd { font-family: var(--f-num); font-size: 11.5px; padding: 1px 5px; border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; background: var(--panel-2); }

/* ---- panneaux flottants ---- */
.pop { position: fixed; z-index: 20; background: var(--panel); border: 1px solid var(--rule); border-radius: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; max-height: min(78vh, 640px); }
.pop-head { display: flex; align-items: center; gap: 8px; padding: 12px 12px 8px 16px; }
.pop-head h2 { margin: 0; font-size: 15px; font-weight: 700; flex: 1; }
.tabs { display: flex; gap: 4px; padding: 0 12px 10px; overflow-x: auto; scrollbar-width: none; flex: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { height: 30px; padding: 0 11px; border: 1px solid var(--rule); border-radius: 15px; background: transparent; font-size: 12.5px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.tab[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--panel); }
/* bibliothèque : domaines (grandes pastilles) puis sous-catégories, sur plusieurs lignes pour rester visibles au doigt et au Pencil */
.tabs.dom { flex-wrap: wrap; gap: 6px; padding-bottom: 8px; }
.tabs.dom .tab { height: 38px; padding: 0 14px; font-size: 13.5px; border-radius: 19px; }
.tabs.subs { flex-wrap: wrap; gap: 5px; padding-top: 2px; border-top: 1px solid var(--rule); padding-top: 8px; margin: 0 12px; padding-left: 0; padding-right: 0; }
.tabs.subs .tab { height: 34px; border-radius: 17px; }
.tabs.subs .tab[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.grid-cat { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; padding: 4px 12px 14px; overflow-y: auto; min-height: 0; }
.card { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px 7px; border: 1px solid var(--rule); border-radius: 10px; background: var(--c-room); font-size: 11.5px; font-weight: 600; text-align: center; line-height: 1.2; color: var(--ink); min-height: 104px; }
.card:hover { border-color: var(--accent); }
.cat-search { padding: 0 12px 10px; flex: none; }
.cat-search input { width: 100%; height: 38px; padding: 0 12px; border: 1px solid var(--rule); background: var(--c-room); border-radius: 10px; font-size: 14px; }
.cat-search input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.card canvas { width: 64px; height: 64px; }

    <button class="ib" id="btnUndo" title="Annuler (Ctrl+Z)" aria-label="Annuler"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button class="ib" id="btnRedo" title="Rétablir (Ctrl+Y)" aria-label="Rétablir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
    <button class="ib" id="btnFilter" title="Filtres : n’afficher que les prises, l’éclairage, la VMC…" aria-label="Filtres d’affichage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M3.5 5h17l-6.5 7.5V19l-4 1.5v-8z"/></svg></button>
    <button class="ib" id="btnView" title="Affichage et magnétisme" aria-label="Affichage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 12.5l9 5 9-5"/><path d="M3 17l9 5 9-5"/></svg></button>
    <button class="ib" id="btnExport" title="Exporter en image ou en PDF" aria-label="Exporter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 14V3.5M7.5 8L12 3.5 16.5 8"/><path d="M8 11H6.5A1.5 1.5 0 0 0 5 12.5v7A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5v-7a1.5 1.5 0 0 0-1.5-1.5H16"/></svg></button>
    <button class="ib" id="btnMenu" title="Fichier" aria-label="Menu fichier"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
  </header>

  <div class="main" id="main">
    <nav class="toolbar" id="toolbar" aria-label="Outils">
      <button class="tool" data-tool="select" title="Sélection (V)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M5 3.5l13 7.2-5.6 1.4-2.6 5.4z"/></svg>Sélection</button>
      <button class="tool" data-tool="wall" title="Murs et cloisons (M)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linejoin="miter"><path d="M4 19V6h8v12h8V5"/></svg>Mur</button>
      <button class="tool" data-tool="room" title="Pièce rectangulaire (P)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="4" y="5" width="16" height="14" stroke-width="2.8"/><path d="M8 12h8" stroke-width="1.2" stroke-dasharray="1.5 1.5"/></svg>Pièce</button>
      <button class="tool" data-tool="door" title="Portes et portes de placard (O)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 20h4M17 20h4" stroke-width="3"/><path d="M7 20V6"/><path d="M7 6a14 14 0 0 1 10 14" stroke-dasharray="2 2" stroke-width="1.4"/></svg>Porte</button>
      <button class="tool" data-tool="window" title="Fenêtre (F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12h4M19 12h4" stroke-width="4"/><rect x="5" y="10" width="14" height="4"/><path d="M12 10v4M5 10a7 7 0 0 1 7-7"/></svg>Fenêtre</button>
      <button class="tool" data-tool="gap" title="Ouverture libre (B)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12h6M17 12h6" stroke-width="4"/><path d="M7 8.5v7M17 8.5v7"/><path d="M7 10h10M7 14h10" stroke-width="1.3" stroke-dasharray="1.8 1.6"/></svg>Ouverture</button>
      <div class="tsep"></div>
      <button class="tool" data-tool="furn" title="Mobilier et équipements"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M5 10V7.5A2.5 2.5 0 0 1 7.5 5h9A2.5 2.5 0 0 1 19 7.5V10"/><path d="M3 11.5a1.5 1.5 0 0 1 3 0V15h12v-3.5a1.5 1.5 0 0 1 3 0V18H3z"/></svg>Mobilier</button>
      <button class="tool" data-tool="stairs" title="Escaliers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M3 20h4.5v-4h4v-4h4V8h4V4H21"/></svg>Escalier</button>
      <button class="tool" data-tool="elec" title="Électricité"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3v5M5.5 8h13M5.5 8a6.5 6.5 0 0 0 13 0M12 14.5V18"/><path d="M8 21h8" stroke-width="1.4"/></svg>Électricité</button>
      <button class="tool" data-tool="link" title="Liaisons commandes et éclairages (L)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="5.5" cy="17.5" r="2.3"/><circle cx="18.5" cy="6.5" r="3"/><path d="M7 15.6C8.5 9.6 11.5 6.4 15.4 6.2" stroke-dasharray="2.6 2.4"/></svg>Liaison</button>
      <button class="tool" data-tool="duct" title="Conduits de VMC et gaines électriques (G)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14.5h6.5V4H21"/><path d="M3 20h12V9.5h6"/><path d="M6.5 14.5V20M15 9.5H9.5" stroke-dasharray="1.6 2" stroke-width="1.3"/></svg>Conduit</button>
      <div class="tsep"></div>
      <button class="tool" data-tool="dim" title="Cote (C)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 12h18M3 7v10M21 7v10M5 14l2-4M17 14l2-4"/></svg>Cote</button>
      <button class="tool" data-tool="text" title="Texte (T)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 7V4.5h14V7M12 4.5v15M9 19.5h6"/></svg>Texte</button>
    </nav>

    <div class="stage" id="stage">
      <canvas id="cv" aria-label="Plan 2D" tabindex="0"></canvas>
      <div class="hint" id="hint" hidden></div>
      <div class="fpill" id="fpill" hidden></div>
      <div class="dimedit" id="dimEdit" hidden role="dialog" aria-label="Modifier la cote"></div>
      <div class="status" id="status">
        <div class="scalebar"><span id="sbLabel">1 m</span><i id="sbBar" style="width:60px"></i></div>
        <span class="xy" id="xy"></span>
        <span id="lvArea"></span>
      </div>
      <div class="zoom">
        <button class="ib" id="zOut" aria-label="Dézoomer" title="Dézoomer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 12h12"/></svg></button>
        <button class="ib" id="zFit" aria-label="Recadrer le plan" title="Recadrer le plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
        <button class="ib" id="zIn" aria-label="Zoomer" title="Zoomer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 12h12M12 6v12"/></svg></button>
      </div>
    </div>

    <aside class="insp" id="insp" aria-label="Propriétés"></aside>
  </div>

  <section class="v3" id="view3d" hidden aria-label="Vue 3D">
    <canvas id="cv3" aria-label="Maquette 3D du plan"></canvas>
    <div class="v3-labels" id="v3labels" aria-hidden="true"></div>
    <div class="v3-panel" id="v3panel"></div>
    <div class="v3-info" id="v3info" hidden></div>
    <div class="v3-joy" id="v3joy" hidden aria-label="Joystick de déplacement"><i></i></div>
    <div class="v3-empty" id="v3empty" hidden><b>Le plan est vide</b><span>Dessinez des murs ou une pièce dans l’onglet Plan : la maquette 3D se construit toute seule.</span></div>
    <div class="v3-msg" id="v3msg" hidden><h3>3D indisponible</h3><p>Ce navigateur ne permet pas l’affichage 3D (WebGL 2). Sur iPad, mettez à jour iPadOS ou ouvrez Calque dans Safari.</p></div>
  </section>

  <div class="ev" id="elecView" hidden>
    <aside class="ev-side" id="evSide" aria-label="Circuits du tableau"></aside>
    <section class="ev-work">
      <div class="ev-bar" id="evBar"></div>
      <div class="ev-canvas" id="evCanvas"></div>
    </section>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="pop" id="catalog" hidden role="dialog" aria-label="Catalogue"></div>
<div class="pop" id="viewPop" hidden role="dialog" aria-label="Affichage"></div>
<div class="pop" id="filterPop" hidden role="dialog" aria-label="Filtres d’affichage"></div>
<div class="pop" id="menuPop" hidden role="dialog" aria-label="Fichier"></div>
<div class="pop" id="lvlPop" hidden role="dialog" aria-label="Ajouter un niveau"></div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<script type="module" src="js/main.js"></script>

</body></html>
